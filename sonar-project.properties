# SonarQube Configuration for SoftTech App (UI + .NET API)
sonar.projectKey=SoftTech-app
sonar.projectName=SoftTech
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9000

# Source directories for Frontend UI (src/) and Backend API (backend/)
sonar.sources=src,backend

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,dist/**,public/**,coverage/**,**/bin/**,**/obj/**
